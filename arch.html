<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Arch — 轮回机器 S4 环求解器台架</title>
    <style>
      body {
        margin: 0;
        background: #fafaf7;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      /* SPEC §5 条 1：SVG presentation attribute 不解析 var()，颜色一律走 class */
      svg {
        width: min(92vw, 760px);
        touch-action: none; /* SPEC §4.3 坑 4 */
      }
      .plate {
        fill: rgba(36, 86, 166, 0.06);
        stroke: #1f1f1d;
        stroke-width: 1.6;
        stroke-linejoin: round;
      }
      .bar {
        stroke: #1f1f1d;
        stroke-width: 2.5;
        stroke-linecap: round;
      }
      .decor {
        stroke: #d9d9d1;
        stroke-width: 1.2;
        fill: none;
      }
      .slot {
        stroke: #8a8a82;
        stroke-width: 3;
        stroke-linecap: round;
        opacity: 0.5;
      }
      .joint-pin {
        fill: #1f1f1d;
      }
      .joint-fixed {
        fill: #1f1f1d;
      }
      .joint-handle {
        fill: #ffffff;
        stroke: #2456a6;
        stroke-width: 2;
        cursor: grab;
      }
      .hud {
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        fill: #8a8a82;
      }
      nav {
        position: fixed;
        top: 10px;
        left: 14px;
        font: 12px ui-monospace, Menlo, Consolas, monospace;
      }
      nav a {
        color: #2456a6;
      }
    </style>
  </head>
  <body>
    <nav><a href="./index.html">← 四杆台架</a></nav>
    <svg id="fig" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg"></svg>
    <script type="module" src="/src/demo/arch.ts"></script>
  </body>
</html>
