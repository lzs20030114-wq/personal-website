<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tentacle 3D — 轮回机器 立体肌腱触手台架</title>
    <style>
      body {
        margin: 0;
        background: #fafaf7;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      /* SPEC §5 条 1：SVG presentation attribute 不解析 var()，颜色一律走 class */
      svg {
        width: min(92vw, 720px);
        touch-action: none;
        cursor: grab;
      }
      .ground {
        stroke: #8a8a82;
        stroke-width: 1.2;
        fill: none;
        stroke-dasharray: 4 4;
      }
      .spine {
        stroke: #8a8a82;
        stroke-width: 2;
      }
      .disc {
        fill: none;
        stroke: #62625b;
        stroke-width: 0.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .shade {
        stroke: none;
        fill-opacity: 0.8;
      }
      .mount {
        fill: none;
        stroke: #9a9a92;
        stroke-width: 0.45;
        stroke-linejoin: round;
      }
      .tendon {
        stroke-width: 1.8;
        fill: none;
        stroke-linecap: round;
      }
      .tendon-0 {
        stroke: #2456a6;
      }
      .tendon-1 {
        stroke: #b0682f;
      }
      .tendon-2 {
        stroke: #4a7a52;
      }
      .hud {
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        fill: #8a8a82;
      }
      nav {
        position: fixed;
        top: 10px;
        left: 14px;
        font: 12px ui-monospace, Menlo, Consolas, monospace;
      }
      nav a {
        color: #2456a6;
        margin-right: 12px;
      }
      #hint {
        position: fixed;
        top: 10px;
        right: 14px;
        font: 12px ui-monospace, Menlo, Consolas, monospace;
        color: #8a8a82;
      }
      #controls {
        position: fixed;
        bottom: 14px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 8px;
        font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        color: #1f1f1d;
        background: #fafaf7;
        padding: 8px 12px;
        border: 1px solid #d9d9d1;
      }
      #controls .row {
        display: flex;
        gap: 14px;
        align-items: center;
        justify-content: center;
      }
      #controls .seg {
        display: flex;
        border: 1px solid #d9d9d1;
      }
      #controls .seg button {
        border: none;
        border-right: 1px solid #d9d9d1;
        color: #8a8a82;
        padding: 2px 10px;
      }
      #controls .seg button:last-child {
        border-right: none;
      }
      #controls .seg button.active {
        color: #fafaf7;
        background: #2456a6;
      }
      #controls label {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      #controls input[type='range'] {
        width: 110px;
      }
      #tendon-0 {
        accent-color: #2456a6;
      }
      #tendon-1 {
        accent-color: #b0682f;
      }
      #tendon-2 {
        accent-color: #4a7a52;
      }
      #controls button {
        font: inherit;
        color: #2456a6;
        background: none;
        border: 1px solid #d9d9d1;
        padding: 2px 10px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="./index.html">← 四杆台架</a><a href="./arch.html">拱环台架</a
      ><a href="./tentacle.html">触手·平面</a>
    </nav>
    <div id="hint">拖拽旋转 · 滚轮/双指缩放 · 滑块收缩肌腱</div>
    <svg id="fig" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="controls">
      <div class="row">
        <label>肌腱1 <input id="tendon-0" type="range" min="0" max="100" value="0" /></label>
        <label>肌腱2 <input id="tendon-1" type="range" min="0" max="100" value="0" /></label>
        <label>肌腱3 <input id="tendon-2" type="range" min="0" max="100" value="0" /></label>
      </div>
      <div class="row">
        <span>联动</span>
        <span class="seg">
          <button id="link-none" class="active">无</button>
          <button id="link-01">1+2</button>
          <button id="link-12">2+3</button>
          <button id="link-02">1+3</button>
        </span>
        <button id="relax">放松</button>
        <button id="home">归位</button>
        <button id="view-home">视角归位</button>
      </div>
    </div>
    <script type="module" src="/src/demo/tentacle3d.ts"></script>
  </body>
</html>
