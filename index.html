<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Linkage — 轮回机器 四杆求解器台架</title>
    <style>
      body {
        margin: 0;
        background: #fafaf7;
        display: grid;
        place-items: center;
        min-height: 100vh;
      }
      /* SPEC §5 条 1：SVG presentation attribute 不解析 var()，颜色一律走 class */
      svg {
        width: min(92vw, 760px);
        touch-action: none; /* SPEC §4.3 坑 4 */
      }
      .grid-dot {
        fill: #e6e6dd;
      }
      .trace {
        stroke: #2456a6;
        stroke-width: 1.4;
        fill: none;
        opacity: 0.85;
      }
      .frame-line {
        stroke: #d9d9d1;
        stroke-width: 1;
        stroke-dasharray: 10 4 2 4; /* 工程中心线 */
      }
      .decor {
        stroke: #d9d9d1;
        stroke-width: 1.2;
        fill: none;
        stroke-dasharray: 4 5; /* 作图线：曲柄圆 */
      }
      .ground {
        stroke: #1f1f1d;
        stroke-width: 1.2;
        fill: none;
      }
      .bar {
        stroke: #1f1f1d;
        stroke-width: 2.5;
        stroke-linecap: round;
      }
      .plate {
        fill: rgba(36, 86, 166, 0.06);
        stroke: #d9d9d1; /* 发丝线勾边（SPEC §4.4） */
        stroke-width: 1.2;
        stroke-linejoin: round;
      }
      .joint-fixed {
        fill: #1f1f1d;
      }
      .joint-free {
        fill: #ffffff;
        stroke: #2456a6;
        stroke-width: 2;
        cursor: grab;
      }
      .label {
        font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        fill: #1f1f1d;
      }
      .dim {
        font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        fill: #8a8a82;
        text-anchor: middle;
      }
      .tb-box {
        fill: #fafaf7;
        stroke: #1f1f1d;
        stroke-width: 1.2;
      }
      .tb-rule {
        stroke: #d9d9d1;
        stroke-width: 1;
      }
      .tb-title {
        font: 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        fill: #1f1f1d;
      }
      .tb-sub,
      .tb-live {
        font: 10px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      .tb-sub {
        fill: #8a8a82;
      }
      .tb-live {
        fill: #1f1f1d;
      }
      nav {
        position: fixed;
        top: 10px;
        left: 14px;
        font: 12px ui-monospace, Menlo, Consolas, monospace;
      }
      nav a {
        color: #2456a6;
        margin-right: 12px;
      }
    </style>
  </head>
  <body>
    <nav><a href="./arch.html">拱环台架</a> <a href="./tentacle.html">触手台架</a></nav>
    <svg id="fig" viewBox="0 0 700 520" xmlns="http://www.w3.org/2000/svg"></svg>
    <script type="module" src="/src/demo/main.ts"></script>
  </body>
</html>
